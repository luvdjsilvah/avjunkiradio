<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AV Junki Radio | Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #15100d;
      color: #f4eee8;
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      background: #211711;
      border-bottom: 1px solid #5a4030;
      padding: 22px 28px;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
      letter-spacing: 0.5px;
    }

    header p {
      margin: 7px 0 0;
      color: #bfae9f;
      font-size: 14px;
    }
.header-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
}

.logout-button {
  display: inline-block;
  border: 1px solid #80614d;
  border-radius: 8px;
  padding: 10px 16px;
  background: #332219;
  color: #f4eee8;
  text-decoration: none;
  font-weight: 700;
  font-size: 14px;
  white-space: nowrap;
}

.logout-button:hover {
  background: #422c20;
}
    main {
      width: min(1100px, calc(100% - 32px));
      margin: 32px auto;
    }

    .status {
      background: #211711;
      border: 1px solid #4a3529;
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 24px;
    }

    .status.good {
      background: #1d2a20;
      border-color: #355b3c;
      color: #b8e0bd;
    }

    .status.bad {
      background: #321b1b;
      border-color: #743c3c;
      color: #f1b8b8;
    }

    .section-title {
      margin: 0 0 16px;
      font-size: 20px;
    }

    .drop-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }

    .drop-card {
      background: #211711;
      border: 1px solid #4a3529;
      border-radius: 12px;
      padding: 18px;
    }

    .drop-card h2 {
      margin: 0 0 6px;
      font-size: 17px;
    }

    .drop-card p {
      margin: 0 0 8px;
      color: #bfae9f;
      font-size: 13px;
      line-height: 1.45;
    }

    .slot-label {
      color: #d5bda9;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    audio {
      width: 100%;
      margin: 10px 0 14px;
    }

    .button {
      display: inline-block;
      width: 100%;
      border: 1px solid #80614d;
      border-radius: 8px;
      padding: 11px 14px;
      background: #332219;
      color: #f4eee8;
      text-align: center;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
    }

    .button:hover {
      background: #422c20;
    }

    .button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .upload-button {
      margin-top: 10px;
      background: #4b2e20;
    }

    input[type="file"] {
      display: none;
    }

    .selected-file {
      min-height: 18px;
      margin-top: 9px;
      color: #cdb9aa;
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .message {
      min-height: 18px;
      margin-top: 10px;
      font-size: 12px;
    }

    .message.good {
      color: #9fd0a7;
    }

    .message.bad {
      color: #efa7a7;
    }

    footer {
      margin-top: 30px;
      color: #8f8177;
      font-size: 12px;
      text-align: center;
    }
    .admin-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 24px;
}

.admin-tab {
  border: 1px solid #80614d;
  border-radius: 8px;
  padding: 11px 18px;
  background: #2a1d16;
  color: #d9c8ba;
  cursor: pointer;
  font-weight: 700;
  font-size: 14px;
}

.admin-tab:hover {
  background: #3a281e;
}

.admin-tab.active {
  background: #5a3928;
  color: #ffffff;
  border-color: #a8785a;
}

.admin-section {
  display: none;
}

.admin-section.active {
  display: block;
}
    .music-genre-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 20px;
}

.music-genre-tab {
  border: 1px solid #80614d;
  border-radius: 8px;
  padding: 9px 14px;
  background: #211712;
  color: #d9c8ba;
  cursor: pointer;
  font-weight: 700;
  font-size: 13px;
}

.music-genre-tab:hover {
  background: #34241b;
}

.music-genre-tab.active {
  background: #6a4430;
  color: #ffffff;
  border-color: #b48768;
}
  </style>
</head>

<body>

<header>
  <div class="header-row">
    <div>
      <h1>AV Junki Radio Admin</h1>
      <p>Station Drop Manager</p>
    </div>

    <a
      class="logout-button"
      href="/cdn-cgi/access/logout"
    >
      Logout
    </a>
  </div>
</header>

  <main>

    <div class="status" id="apiStatus">
      Connecting to AV Junki Radio Admin API...
    </div>

  <div class="admin-tabs">
  <button class="admin-tab active" data-section="drops">
    Drops
  </button>

  <button class="admin-tab" data-section="music">
    MP3
  </button>

  <button class="admin-tab" data-section="images">
    Image Ads
  </button>

  <button class="admin-tab" data-section="video">
    Video
  </button>
</div>

<section class="admin-section active" id="section-drops">
  <h2 class="section-title">Station Drops</h2>
  <div class="drop-grid" id="dropGrid"></div>
</section>

<section class="admin-section" id="section-music">
  <h2 class="section-title">MP3 Music</h2>

  <div class="music-genre-tabs">
    <button class="music-genre-tab active" data-genre="all">
      All Audio
    </button>

    <button class="music-genre-tab" data-genre="jazz">
      Jazz
    </button>

    <button class="music-genre-tab" data-genre="hip-hop">
      Hip Hop
    </button>

    <button class="music-genre-tab" data-genre="rnb">
      R&amp;B
    </button>

    <button class="music-genre-tab" data-genre="house">
      House
    </button>

    <button class="music-genre-tab" data-genre="reggae">
      Reggae
    </button>

    <button class="music-genre-tab" data-genre="gospel">
      Gospel
    </button>

    <button class="music-genre-tab" data-genre="podcast">
      Podcast
    </button>

    <button class="music-genre-tab" data-genre="unassigned">
      Unassigned
    </button>
  </div>

  <div id="musicLibrary">
    <p>Music and podcast upload tools will go here.</p>
  </div>
</section>

<section class="admin-section" id="section-images">
  <h2 class="section-title">Image Ads</h2>
  <p>Image ad upload tools will go here.</p>
</section>

<section class="admin-section" id="section-video">
  <h2 class="section-title">Video</h2>
  <p>Video upload tools will go here.</p>
</section>

    <footer>
      AV Junki Radio • Internal Administration
    </footer>

  </main>

  <script>
    "use strict";

    const API_BASE =
      "https://av-junki-radio-admin-api.luvdjsilvah.workers.dev";

    const apiStatus =
      document.getElementById("apiStatus");

    const dropGrid =
      document.getElementById("dropGrid");


    function escapeHtml(value) {

      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    function formatDuration(seconds) {

      const total =
        Math.max(
          0,
          Number(seconds) || 0
        );

      const minutes =
        Math.floor(total / 60);

      const remaining =
        Math.floor(total % 60);

      return `${minutes}:${String(remaining).padStart(2, "0")}`;

    }
function getAudioDuration(file) {

  return new Promise(
    (resolve, reject) => {

      const audio =
        document.createElement("audio");

      const objectUrl =
        URL.createObjectURL(file);

      audio.preload =
        "metadata";

      audio.onloadedmetadata =
        () => {

          const duration =
            audio.duration;

          URL.revokeObjectURL(
            objectUrl
          );

          if (
            Number.isFinite(duration) &&
            duration > 0
          ) {

            resolve(duration);

          } else {

            reject(
              new Error(
                "Could not read the audio duration."
              )
            );

          }

        };

      audio.onerror =
        () => {

          URL.revokeObjectURL(
            objectUrl
          );

          reject(
            new Error(
              "Could not read the selected audio file."
            )
          );

        };

      audio.src =
        objectUrl;

    }
  );

}

    function getCurrentAudioUrl(drop) {

      if (drop.audio_url) {
        return drop.audio_url;
      }

      if (drop.url) {
        return drop.url;
      }

      if (drop.r2_url) {
        return drop.r2_url;
      }
if (drop.r2_key) {
  return `${API_BASE}/api/audio/${encodeURIComponent(drop.slot_key)}`;
}
      if (drop.source_path) {
        return `../${drop.source_path}`;
      }

      return "";

    }


    async function checkApi() {

      try {

        const response =
          await fetch(
            `${API_BASE}/api/health`,
            {
              cache: "no-store"
            }
          );

        const result =
          await response.json();

        if (
          !response.ok ||
          !result.ok
        ) {
          throw new Error(
            result.error ||
            "Admin API health check failed."
          );
        }

        apiStatus.className =
          "status good";

        apiStatus.textContent =
          `Admin API connected — Database connected — Audio bucket ${
            result.audioBucket || "connected"
          } — ${result.dropCount ?? 0} station drops`;

        return true;

      } catch (error) {

        apiStatus.className =
          "status bad";

        apiStatus.textContent =
          `Admin API connection failed: ${
            error instanceof Error
              ? error.message
              : String(error)
          }`;

        return false;

      }

    }


    function createDropCard(drop) {

      const slot =
        drop.slot_key;

      const card =
        document.createElement("div");

      card.className =
        "drop-card";

      const audioUrl =
        getCurrentAudioUrl(drop);

      card.innerHTML = `
        <div class="slot-label">
          ${escapeHtml(slot)}
        </div>

        <h2>
          ${escapeHtml(drop.title)}
        </h2>

        <p>
          ${escapeHtml(drop.artist)}
        </p>

        <p>
          Current file:
          ${escapeHtml(drop.original_filename)}
        </p>

        <p>
          Duration:
          ${formatDuration(drop.duration_seconds)}
          • Version:
          ${escapeHtml(drop.version)}
        </p>

        ${
          audioUrl
            ? `
              <audio
                controls
                preload="none"
                src="${escapeHtml(audioUrl)}"
              ></audio>
            `
            : `
              <p>
                No preview URL available.
              </p>
            `
        }

        <label
          class="button"
          for="file-${escapeHtml(slot)}"
        >
          Choose Replacement
        </label>

        <input
          id="file-${escapeHtml(slot)}"
          type="file"
          accept=".mp3,.wav,.m4a,audio/mpeg,audio/wav,audio/mp4,audio/x-m4a"
        >

        <div
          class="selected-file"
          id="selected-${escapeHtml(slot)}"
        >
          No replacement selected.
        </div>

        <button
          class="button upload-button"
          id="upload-${escapeHtml(slot)}"
          type="button"
          disabled
        >
          Upload Replacement
        </button>

        <div
          class="message"
          id="message-${escapeHtml(slot)}"
        ></div>
      `;


      const fileInput =
        card.querySelector(
          `#file-${CSS.escape(slot)}`
        );

      const selected =
        card.querySelector(
          `#selected-${CSS.escape(slot)}`
        );

      const uploadButton =
        card.querySelector(
          `#upload-${CSS.escape(slot)}`
        );

      const message =
        card.querySelector(
          `#message-${CSS.escape(slot)}`
        );


      fileInput.addEventListener(
        "change",
        () => {

          const file =
            fileInput.files?.[0];

          if (!file) {

            selected.textContent =
              "No replacement selected.";

            uploadButton.disabled =
              true;

            return;

          }

          selected.textContent =
            file.name;

          uploadButton.disabled =
            false;

          message.textContent =
            "";

          message.className =
            "message";

        }
      );


      uploadButton.addEventListener(
        "click",
        async () => {

          const file =
            fileInput.files?.[0];

          if (!file) {
            return;
          }


          uploadButton.disabled =
            true;

          uploadButton.textContent =
            "Uploading...";

          message.className =
            "message";

          message.textContent =
            "Sending replacement to AV Junki Radio Admin API...";


          try {

            const formData =
              new FormData();

            formData.append(
              "file",
              file,
              file.name
            );
formData.append(
  "duration",
  String(await getAudioDuration(file))
);

            const response =
              await fetch(
                `${API_BASE}/api/drops/${encodeURIComponent(slot)}/upload`,
                {
                  method: "POST",
                  body: formData
                }
              );


            const result =
              await response.json();


            if (
              !response.ok ||
              !result.ok
            ) {

              throw new Error(
                result.error ||
                "Upload failed."
              );

            }


            message.className =
              "message good";

            message.textContent =
              "Replacement uploaded successfully.";

            fileInput.value =
              "";

            selected.textContent =
              "No replacement selected.";


            await loadDrops();


          } catch (error) {

            message.className =
              "message bad";

            message.textContent =
              error instanceof Error
                ? error.message
                : String(error);

          } finally {

            uploadButton.textContent =
              "Upload Replacement";

            uploadButton.disabled =
              !fileInput.files?.length;

          }

        }
      );


      return card;

    }


    async function loadDrops() {

      try {

        const response =
          await fetch(
            `${API_BASE}/api/drops`,
            {
              cache: "no-store"
            }
          );

        const result =
          await response.json();


        if (
          !response.ok ||
          !result.ok
        ) {

          throw new Error(
            result.error ||
            "Could not load station drops."
          );

        }


        dropGrid.innerHTML =
          "";


        if (
          !Array.isArray(result.drops) ||
          result.drops.length === 0
        ) {

          dropGrid.innerHTML =
            "<p>No station drops were returned by the Admin API.</p>";

          return;

        }


        result.drops.forEach(
          (drop) => {

            dropGrid.appendChild(
              createDropCard(drop)
            );

          }
        );


      } catch (error) {

        dropGrid.innerHTML =
          `<p>Unable to load station drops: ${
            escapeHtml(
              error instanceof Error
                ? error.message
                : String(error)
            )
          }</p>`;

      }

    }


    async function startAdmin() {

      const connected =
        await checkApi();

      if (!connected) {
        return;
      }

      await loadDrops();

    }


    startAdmin();
  </script>
<script>
  document.querySelectorAll(".admin-tab").forEach((tab) => {
    tab.addEventListener("click", () => {

      document.querySelectorAll(".admin-tab").forEach((button) => {
        button.classList.remove("active");
      });

      document.querySelectorAll(".admin-section").forEach((section) => {
        section.classList.remove("active");
      });

      tab.classList.add("active");

      const targetSection =
        document.getElementById(
          `section-${tab.dataset.section}`
        );

      if (targetSection) {
        targetSection.classList.add("active");
      }

    });
  });
</script>
</body>
</html>
